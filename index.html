<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather app</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="weather-container.css" />
    <link rel="stylesheet" href="2-column-layout.css" />
    <script src="scripts/inputSearch.js"></script>
    <script src="scripts/weather-container.js"></script>
    <script src="scripts/location-based-weather.js"></script>
    <style>
      /* Notion-like page container */
      .page-container {
        max-width: 900px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      .page-title {
        font-size: 40px;
        font-weight: 700;
        color: #37352f;
        margin-bottom: 8px;
        border: none;
        outline: none;
        width: 100%;
        background: transparent;
      }

      .page-subtitle {
        color: #9b9a97;
        font-size: 16px;
        margin-bottom: 32px;
      }

      .section-divider {
        height: 1px;
        background-color: #e9e9e7;
        margin: 32px 0;
      }

      .section-title {
        font-size: 20px;
        font-weight: 600;
        color: #37352f;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <header class="header-bar">
      <div class="left-section">
        <div class="dropdown">
          <button class="dropbtn">Menu</button>
          <img
            src="https://cdn-icons-png.flaticon.com/512/25/25391.png"
            alt="menu-icon"
            width="25"
            height="25"
            class="menu-icon"
          />
          <div class="dropdown-content">
            <a href="https://www.weatherapi.com/" target="_blank"
              >Weather API</a
            >
            <a target="_blank" href="https://www.windy.com">Weather widget</a>
          </div>
        </div>
      </div>
      <div class="center-section">
        <input
          type="search"
          class="search-input"
          placeholder="Search location..."
        />
        <button class="search-button">Search</button>
      </div>
      <div class="right-section">
        <a
          href="https://github.com/Lyeeroy/weather-app"
          class="github-icon"
          target="_blank"
        >
          <img
            src="https://cdn-icons-png.flaticon.com/512/25/25231.png"
            alt="GitHub"
            width="30"
            height="30"
          />
        </a>
      </div>
    </header>
    <div style="height: 6rem"></div>
    
    <div class="page-container">
      <h1 class="page-title">Weather Dashboard</h1>
      <p class="page-subtitle">Real-time weather information from cities around the world</p>
      
      <div id="ipBasedWeather">
        <div class="two-column-layout">
          <div class="left-column">
            <h2 style="margin-top: 0; font-size: 24px;">Current Location Weather</h2>
            <p style="color: #9b9a97; font-size: 14px; margin-top: 8px;">Weather data based on your IP address location.</p>
          </div>
          <div class="right-column">
            <img
              title="The weather of this location is based on your IP address."
              width="20"
              height="20"
              style="cursor: pointer; opacity: 0.6;"
              src="https://cdn-icons-png.flaticon.com/512/471/471715.png"
              alt="?"
            />
          </div>
        </div>
      </div>
      
      <div class="section-divider"></div>
      
      <h3 class="section-title">Popular Cities</h3>
      <div class="content"></div>
    </div>
    
    <footer class="footer-bar">
      <a target="_blank" href="https://github.com/Lyeeroy">
        <img
          src="https://cdn-icons-png.flaticon.com/512/25/25231.png"
          alt="GitHub"
        />
      </a>
      <a target="_blank" href="https://github.com/Lyeeroy">/Lyeeroy</a>
    </footer>
  </body>
</html>
